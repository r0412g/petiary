name: Appium Smoke UI Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - qa

jobs:
  appium-smoke-test:
    name: Run Appium Smoke Tests

    if: >-
      (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'master') ||
      (github.event.pull_request.head.ref == 'test/setting-action-for-smoke-test' && github.event.pull_request.base.ref == 'qa')

    # 支援 Android Emulator 硬體加速
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Set up Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Appium Smoke Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            appium --log appium.log &
            sleep 10
            pytest tests/ -m smoke --html=report.html --self-contained-html || true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-smoke-test-report
          path: |
            report.html
            appium.log