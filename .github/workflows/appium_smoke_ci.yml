name: Appium Smoke UI Test

on:
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - qa

jobs:
  appium-smoke-test:
    name: Run Appium Smoke Tests

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'master') ||
      (github.event.pull_request.head.ref == 'test/setting-action-for-smoke-test' && github.event.pull_request.base.ref == 'qa')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      - name: Build Android Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Set up Node.js & Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Run Appium Smoke Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          disable-animations: true
          ram-size: 4096MB
          emulator-options: -no-snapshot-save -no-window
          script: |
            echo "Waiting for emulator to finish booting..."
            adb wait-for-device
            appium --log appium.log &
            sleep 10
            pytest tests/ -m smoke --html=report.html --self-contained-html || true

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-smoke-test-report
          path: |
            report.html
            appium.log